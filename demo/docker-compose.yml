version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: nms-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: nms-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=nms_db
    depends_on:
      - mongodb

volumes:
  mongo-data: